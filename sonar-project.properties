# Análise estática do SonarCloud pelo CI (job "sonarcloud" em .github/workflows/ci.yml).
# Só é usado quando o secret SONAR_TOKEN existe e a Automatic Analysis está desligada no SonarCloud.
sonar.projectKey=davigrossis_software-engineering-project
sonar.organization=davigrossis
sonar.projectName=COOPAF

# Código de produção
sonar.sources=app,lib,components
sonar.exclusions=**/*.test.ts,app/generated/**

# Testes (não entram nas métricas de código, só na cobertura)
sonar.tests=lib,tests
sonar.test.inclusions=lib/**/*.test.ts,tests/**

# Cobertura gerada pelo Vitest no job "verificar" (artefato "cobertura")
sonar.javascript.lcov.reportPaths=coverage/unidade/lcov.info,coverage/integracao/lcov.info

sonar.sourceEncoding=UTF-8
